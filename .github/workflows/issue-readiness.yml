name: Issue readiness

on:
  issues:
    types: [closed, edited, labeled, reopened, unlabeled]

permissions: {}

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate implementation readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Validate and record the issue contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEIKO_ISSUE_LIFECYCLE_ACTIVATION: disabled
        run: node quality/issue-readiness-action.mjs

  publish-locator:
    name: Publish bounded lifecycle locator
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the protected governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Prepare exact lifecycle locator bytes
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KEIKO_WAKE_ISSUE_NUMBER: ${{ github.event.issue.number }}
          KEIKO_WAKE_PULL_REQUEST_NUMBER: ""
          KEIKO_WAKE_SOURCE_WORKFLOW_PATH: .github/workflows/issue-readiness.yml
        run: node quality/lifecycle-wake-locator-writer.mjs
      - name: Upload exact lifecycle locator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keiko-lifecycle-wake-locator-v1
          path: .keiko-lifecycle-wake-locator/locator.bin
          if-no-files-found: error
          retention-days: 1
