name: Contract publication (inert)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Governed issue number for the inert publication
        required: true
        type: string
      pull_request_number:
        description: Optional canonical pull-request number
        required: false
        type: string
  workflow_call:
    inputs:
      schema_version:
        required: true
        type: string
      producer_contract_version:
        required: true
        type: string
      repository:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      pull_request_number:
        required: true
        type: string
      exact_head_sha:
        required: true
        type: string
      exact_target:
        required: true
        type: string
      generation_bytes_base64:
        required: true
        type: string
      generation_bytes_sha256:
        required: true
        type: string
      generation_identity:
        required: true
        type: string
      attempt:
        required: true
        type: string
      phase_fence_comment_id:
        required: true
        type: string
      phase_fence_digest:
        required: true
        type: string
      generation_request_comment_id:
        required: true
        type: string
      generation_request_digest:
        required: true
        type: string
      request_identity:
        required: true
        type: string
      request_payload_digest:
        required: true
        type: string
      expected_producer:
        required: true
        type: string
    outputs:
      observation:
        description: Authenticated producer-result observation identity
        value: ${{ jobs.producer.outputs.observation }}

permissions: {}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.KEIKO_CONTRACT_PUBLICATION_ACTIVATION == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the protected governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Validate protected publication policy
        env:
          KEIKO_CONTRACT_PUBLICATION_ACTIVATION: disabled
        run: |
          node --check quality/publication-contract.mjs
          node --check quality/lifecycle-handoff-publication.mjs

  publish-locator:
    name: Publish bounded lifecycle locator
    needs: validate
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the protected governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Prepare exact lifecycle locator bytes
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          KEIKO_WAKE_ISSUE_NUMBER: ${{ inputs.issue_number }}
          KEIKO_WAKE_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          KEIKO_WAKE_SOURCE_WORKFLOW_PATH: .github/workflows/contract-publication.yml
        run: node quality/lifecycle-wake-locator-writer.mjs
      - name: Upload exact lifecycle locator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keiko-lifecycle-wake-locator-v1
          path: .keiko-lifecycle-wake-locator/locator.bin
          if-no-files-found: error
          retention-days: 1

  producer:
    name: Produce authenticated lifecycle result
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      observation: ${{ steps.verify.outputs.observation }}
    concurrency:
      group: issue-lifecycle-provider-budget
      queue: max
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Check out the protected producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Evaluate and prepare the exact producer result
        id: producer
        env:
          KEIKO_PRODUCER_SCHEMA_VERSION: ${{ inputs.schema_version }}
          KEIKO_PRODUCER_CONTRACT_VERSION: ${{ inputs.producer_contract_version }}
          KEIKO_PRODUCER_REPOSITORY: ${{ inputs.repository }}
          KEIKO_PRODUCER_ISSUE_NUMBER: ${{ inputs.issue_number }}
          KEIKO_PRODUCER_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          KEIKO_PRODUCER_EXACT_HEAD_SHA: ${{ inputs.exact_head_sha }}
          KEIKO_PRODUCER_EXACT_TARGET: ${{ inputs.exact_target }}
          KEIKO_PRODUCER_GENERATION_BYTES_BASE64: ${{ inputs.generation_bytes_base64 }}
          KEIKO_PRODUCER_GENERATION_BYTES_SHA256: ${{ inputs.generation_bytes_sha256 }}
          KEIKO_PRODUCER_GENERATION_IDENTITY: ${{ inputs.generation_identity }}
          KEIKO_PRODUCER_ATTEMPT: ${{ inputs.attempt }}
          KEIKO_PRODUCER_PHASE_FENCE_COMMENT_ID: ${{ inputs.phase_fence_comment_id }}
          KEIKO_PRODUCER_PHASE_FENCE_DIGEST: ${{ inputs.phase_fence_digest }}
          KEIKO_PRODUCER_GENERATION_REQUEST_COMMENT_ID: ${{ inputs.generation_request_comment_id }}
          KEIKO_PRODUCER_GENERATION_REQUEST_DIGEST: ${{ inputs.generation_request_digest }}
          KEIKO_PRODUCER_REQUEST_IDENTITY: ${{ inputs.request_identity }}
          KEIKO_PRODUCER_REQUEST_PAYLOAD_DIGEST: ${{ inputs.request_payload_digest }}
          KEIKO_PRODUCER_EXPECTED_PRODUCER: ${{ inputs.expected_producer }}
        run: node quality/lifecycle-producer-action.mjs
      - name: Publish and read back the canonical producer record
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEIKO_LIFECYCLE_RECORD_PLAN: ${{ steps.producer.outputs.record-plan }}
        run: node quality/lifecycle-record-writer.mjs prepare
      - name: Upload immutable per-issue producer anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keiko-lifecycle-anchor-v1-issue-${{ inputs.issue_number }}
          path: ${{ steps.prepare.outputs.anchor-path }}
          if-no-files-found: error
          retention-days: 90
      - name: Attest exact producer anchor identity
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ steps.prepare.outputs.subject-checksums }}
          create-storage-record: true
      - name: Verify stable producer comment, anchor, attestation, run, and job
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEIKO_LIFECYCLE_ANCHOR_IDENTITY: ${{ steps.prepare.outputs.anchor-identity }}
          KEIKO_LIFECYCLE_COMMENT_ID: ${{ steps.prepare.outputs.comment-id }}
          KEIKO_LIFECYCLE_RECORD_PLAN: ${{ steps.producer.outputs.record-plan }}
        run: node quality/lifecycle-record-writer.mjs verify
