name: Lifecycle wake-up router

on:
  pull_request_target:
    branches:
      - dev
      - "epic/**"
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        closed,
      ]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed, rerequested]
  workflow_run:
    workflows:
      - Pull request contract
      - Contract publication (inert)
      - CI
      - CodeQL
      - Dependency review
      - OSV Scanner
    types: [completed, requested, in_progress]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request to reconcile from current provider state
        required: true
        type: string

permissions: {}

jobs:
  route:
    name: Resolve non-authoritative lifecycle wake-up
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exact-head-sha: ${{ steps.route.outputs.exact-head-sha }}
      issue-number: ${{ steps.route.outputs.issue-number }}
      pull-request-number: ${{ steps.route.outputs.pull-request-number }}
      wake-event: ${{ steps.route.outputs.wake-event }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out the protected transport
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: dev
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Resolve the current PR and linked issue
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node quality/lifecycle-wakeup-router.mjs

  coordinate:
    name: Dispatch the sole lifecycle coordinator
    needs: route
    permissions: {}
    uses: ./.github/workflows/issue-lifecycle.yml
    with:
      issue_number: ${{ needs.route.outputs.issue-number }}
      pull_request_number: ${{ needs.route.outputs.pull-request-number }}
      exact_head_sha: ${{ needs.route.outputs.exact-head-sha }}
      wake_event: ${{ needs.route.outputs.wake-event }}
